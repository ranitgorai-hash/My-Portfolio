<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a855"/>
      <stop offset="100%" stop-color="#c9822f"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1c17"/>
      <stop offset="100%" stop-color="#0a1512"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- faint circuit traces -->
  <g stroke="#c9822f" stroke-width="4" fill="none" opacity="0.35" stroke-linecap="round">
    <path d="M 40,150 L 130,150 L 130,90"/>
    <path d="M 40,362 L 130,362 L 130,422"/>
    <path d="M 472,150 L 382,150 L 382,90"/>
    <path d="M 472,362 L 382,362 L 382,422"/>
  </g>
  <g fill="#6fe7c4" opacity="0.7">
    <circle cx="130" cy="90" r="6"/>
    <circle cx="130" cy="422" r="6"/>
    <circle cx="382" cy="90" r="6"/>
    <circle cx="382" cy="422" r="6"/>
  </g>

  <!-- chip pins -->
  <g fill="#e8a855" opacity="0.9">
    <rect x="150" y="50" width="10" height="34" rx="3"/>
    <rect x="195" y="50" width="10" height="34" rx="3"/>
    <rect x="240" y="50" width="10" height="34" rx="3"/>
    <rect x="285" y="50" width="10" height="34" rx="3"/>
    <rect x="330" y="50" width="10" height="34" rx="3"/>

    <rect x="150" y="428" width="10" height="34" rx="3"/>
    <rect x="195" y="428" width="10" height="34" rx="3"/>
    <rect x="240" y="428" width="10" height="34" rx="3"/>
    <rect x="285" y="428" width="10" height="34" rx="3"/>
    <rect x="330" y="428" width="10" height="34" rx="3"/>

    <rect x="50" y="150" width="34" height="10" rx="3"/>
    <rect x="50" y="195" width="34" height="10" rx="3"/>
    <rect x="50" y="240" width="34" height="10" rx="3"/>
    <rect x="50" y="285" width="34" height="10" rx="3"/>
    <rect x="50" y="330" width="34" height="10" rx="3"/>

    <rect x="428" y="150" width="34" height="10" rx="3"/>
    <rect x="428" y="195" width="34" height="10" rx="3"/>
    <rect x="428" y="240" width="34" height="10" rx="3"/>
    <rect x="428" y="285" width="34" height="10" rx="3"/>
    <rect x="428" y="330" width="34" height="10" rx="3"/>
  </g>

  <!-- chip body -->
  <rect x="106" y="106" width="300" height="300" rx="34" fill="url(#chip)"/>
  <rect x="106" y="106" width="300" height="300" rx="34" fill="none" stroke="#0a1512" stroke-width="4" opacity="0.25"/>

  <!-- RG monogram -->
  <text x="256" y="285" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-weight="700" font-size="150" fill="#0a1512">RG</text>
</svg>
